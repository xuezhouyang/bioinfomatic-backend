<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Chat Export</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Gemini Chat Export</h1>
      <p class="subtitle">导出 Gemini 会话内容与附件</p>
    </header>

    <div id="status-bar" class="status-bar hidden">
      <div class="progress-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <p id="status-text" class="status-text">准备中...</p>
    </div>

    <div id="not-gemini" class="notice hidden">
      <p>请在 <a href="https://gemini.google.com" target="_blank">gemini.google.com</a> 页面使用此插件</p>
    </div>

    <div id="main-panel">
      <section class="section">
        <h2>导出选项</h2>
        <div class="option-group">
          <label class="checkbox-label">
            <input type="checkbox" id="opt-conversations" checked>
            <span>会话文本内容</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="opt-attachments" checked>
            <span>附件（图片/文件）</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="opt-code-blocks" checked>
            <span>代码块</span>
          </label>
        </div>
      </section>

      <section class="section">
        <h2>导出格式</h2>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="format" value="json" checked>
            <span>JSON</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="format" value="markdown">
            <span>Markdown</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="format" value="html">
            <span>HTML</span>
          </label>
        </div>
      </section>

      <section class="section">
        <h2>导出范围</h2>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="scope" value="current" checked>
            <span>当前会话</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="scope" value="all">
            <span>所有会话（侧边栏列表）</span>
          </label>
        </div>
      </section>

      <div class="actions">
        <button id="btn-export" class="btn btn-primary">开始导出</button>
        <button id="btn-cancel" class="btn btn-secondary hidden">取消</button>
      </div>
    </div>

    <div id="result-panel" class="hidden">
      <section class="section">
        <h2>导出完成</h2>
        <div id="result-summary" class="result-summary"></div>
        <div class="actions">
          <button id="btn-download" class="btn btn-primary">下载文件</button>
          <button id="btn-back" class="btn btn-secondary">返回</button>
        </div>
      </section>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
